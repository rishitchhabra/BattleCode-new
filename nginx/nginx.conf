# Upstream Django container
upstream django {
    server web:8000;
}

# 🔴 Redirect ALL HTTP → HTTPS
server {
    listen 80;
    server_name battlecodearena.gispilibhit.com;

    return 301 https://$host$request_uri;
}

# 🟢 Main HTTPS server
server {
    listen 443 ssl;
    server_name battlecodearena.gispilibhit.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/battlecodearena.gispilibhit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/battlecodearena.gispilibhit.com/privkey.pem;

    # Recommended SSL settings (safe defaults)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Max upload size (important for coding platform)
    client_max_body_size 50M;

    location / {
        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_redirect off;
    }

    # Optional: serve static files (if configured)
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
